<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WINCORP OS v2003.11 - [A.MEHRA]</title>
    <meta name="description" content="WINCcorp enterprise workstation OS build 2003.11- Arun Mehra's terminal.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <!--Physiacl CRT moniter -->
  <div id="crt-frame" class="crt-frame">
     <div class="crt-scanlines"></div>
     <div class="crt-vignette"></div>
     <div class="crt-noise" id="crt-noice"></div>
     <div class="crt-tear" id="crt-tear"></div>
     <!--power boot-->
     <div id="boot-screen" class="boot-screen">
            <div class="power-prompt" id="power-prompt">
                <div class="pc-badge">WINCORP COMPUTING INC. - HARDWARE REV 4.2</div>
                <div class="power-btn-container">
                    <button id="power-btn" class="retro-power-btn" aria-label="Power ON laptop">
                        <Span class="power icon">  </Span>
                        <span class="power text">POWER ON COMPUTER</span>
                    </button>
                </div>
                <div class="power-hint">[click to initialize workstation hardware]</div>
            </div>
            <div class="boot-terminal" id="boot-terminal" style="display:none;">
                <div class="terminal-content" id="terminal-content"></div>
                <div class="terminal-cursor"></div>
            </div>
      </div>
