
<!DOCTYPE html>
<html>
<head>
    <title>Wincorp Computer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="crt-frame" class="crt-frame">
        <section id="boot-screen" class="boot-screen" aria-label="Computer startup">
            <div id="power-prompt" class="power-prompt">
                <p class="pc-badge">WINCORP COMPUTING INC.</p>
                <button id="power-btn" class="retro-power-btn" type="button">
                    POWER ON COMPUTER
                </button>
                <p class="power-hint">[ click to initialize workstation ]</p>
            </div>

            <div id="boot-terminal" class="boot-terminal" hidden>
                <pre id="terminal-content" class="terminal-content"></pre>
                <span class="terminal-cursor" aria-hidden="true"></span>
            </div>
        </section>

        <section id="os-root" class="os-root" hidden>
            <div id="desktop" class="desktop">
                <button id="my-documents" class="desktop-icon" type="button">
                    <img src="assets/icons/files/folder.png" alt="">
                    <span>My Documents</span>
                </button>
                <section id="file-manager" class="file-manager"hidden>
                    <div class="file-manager-titlebar">
                        <span>My Documents</span>
                        <button id="close-file-manager" type="button">
                            X
                        </button>
                    </div>
                    <div class="file-manager-toolbar">
                        <button id="back-button" type="button">
                            <- back
                        </button>

                    </div>
                    <div id="file-manager-content" class="file-manager-content">
                    </div>
                </section>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
